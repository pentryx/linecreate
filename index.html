<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontur Çizgileri</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app" data-theme="light">
        <header id="app-header">
            <div class="app-logo">
                <button class="mobile-menu-toggle" id="menu-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                    </svg>
                </button>
                <div>
                    <h1>Kontur Çizgileri</h1>
                    <p class="text-small text-muted mobile-hidden" id="canvas-info">2100x2100mm • 25mm Grid</p>
                </div>
            </div>

            <div class="header-center">
                <div class="btn-group">
                    <button class="btn btn-icon" id="btn-undo" title="Geri Al">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7v6h6"></path>
                            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                        </svg>
                    </button>
                    <button class="btn btn-icon" id="btn-redo" title="İleri Al">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 7v6h-6"></path>
                            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
                        </svg>
                    </button>
                </div>
                <div class="divider-v mobile-hidden"></div>
                <div class="toggle-group" id="path-type-toggle">
                    <button class="btn btn-sm btn-active" id="btn-type-inner" title="İç Çizim">İç</button>
                    <button class="btn btn-sm" id="btn-type-outer" title="Dış Çizim">Dış</button>
                </div>
                <div class="divider-v mobile-hidden"></div>
                <button class="btn btn-sm" id="btn-grid">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="3" y1="15" x2="21" y2="15"></line>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                        <line x1="15" y1="3" x2="15" y2="21"></line>
                    </svg>
                    <span class="mobile-hidden"></span>
                </button>
                <div class="header-line-settings">
                    <label class="text-small text-muted">Çizgi Sayısı:</label>
                    <input type="number" min="1" max="100" value="35" id="num-lines-input" class="input-number"
                        style="width: 60px">
                    <button class="btn btn-primary btn-sm" id="btn-create-contours">Oluştur</button>
                </div>
                <div class="btn-group">
                    <button class="btn btn-icon" id="btn-zoom-in" title="Yakınlaştır">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            <line x1="11" y1="8" x2="11" y2="14"></line>
                            <line x1="8" y1="11" x2="14" y2="11"></line>
                        </svg>
                    </button>
                    <button class="btn btn-icon" id="btn-zoom-out" title="Uzaklaştır">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            <line x1="8" y1="11" x2="14" y2="11"></line>
                        </svg>
                    </button>
                    <button class="btn btn-icon" id="btn-fit" title="Ekrana Sığdır">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <polyline points="9 21 3 21 3 15"></polyline>
                            <line x1="21" y1="3" x2="14" y2="10"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="header-right">
                <label class="btn btn-sm" style="cursor: pointer" title="Proje Yükle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span class="mobile-hidden">Yükle</span>
                    <input type="file" accept=".ercx" id="load-project-input" style="display: none">
                </label>
                <div class="dropdown">
                    <button class="btn btn-primary btn-sm dropdown-toggle" id="export-toggle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                            <polyline points="16 6 12 2 8 6"></polyline>
                            <line x1="12" y1="2" x2="12" y2="15"></line>
                        </svg>
                        <span class="mobile-hidden">Paylaş</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="export-menu">
                        <button class="dropdown-item" id="export-save-project">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                <polyline points="7 3 7 8 15 8"></polyline>
                            </svg>
                            Projeyi Kaydet
                        </button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" id="export-pdf">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                            PDF
                        </button>
                        <button class="dropdown-item" id="export-dxf">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                                </path>
                                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                <line x1="12" y1="22.08" x2="12" y2="12"></line>
                            </svg>
                            DXF
                        </button>
                        <button class="dropdown-item" id="export-svg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                                <path d="M7 8h6"></path>
                                <path d="M7 12h4"></path>
                                <path d="M7 16h8"></path>
                            </svg>
                            SVG (1:1)
                        </button>
                        <button class="dropdown-item" id="export-dwg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                                </path>
                                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                <line x1="12" y1="22.08" x2="12" y2="12"></line>
                            </svg>
                            DWG
                        </button>
                    </div>
                </div>
                <button class="btn btn-icon" id="btn-theme">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="moon-icon">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="sun-icon" style="display: none">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div id="app-content">
            <aside id="app-sidebar">
                <section class="sidebar-section">
                    <div class="sidebar-section-content">
                        <button class="btn btn-full" id="mode-select">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
                                <path d="M13 13l6 6"></path>
                            </svg>
                            Seçim Modu
                        </button>
                        <button class="btn btn-full" id="mode-freehand">
                            ✏️ Serbest Çizim
                        </button>
                        <button class="btn btn-full" id="mode-bezier">
                            📐 Bezier Eğrisi
                        </button>
                        <button class="btn btn-full" id="mode-straight" style="display: none;">
                            📏 Düz Çizgi (Aktif)
                        </button>
                    </div>
                </section>
                <section class="sidebar-section">
                    <div class="sidebar-section-content">
                        <div class="form-group">
                            <label class="form-label">Boyut (mm)</label>
                            <input type="number" value="100" id="shape-size" class="form-input">
                        </div>
                        <div class="form-group" style="display: none;">
                            <label class="form-label">En (mm)</label>
                            <input type="number" value="150" id="shape-width" class="form-input">
                        </div>
                        <div class="form-group" style="display: none;">
                            <label class="form-label">Boy (mm)</label>
                            <input type="number" value="100" id="shape-height" class="form-input">
                        </div>
                        <div class="form-group" style="display: none;">
                            <label class="form-label">Açı (°): <span id="shape-angle-value">0</span></label>
                            <input type="range" min="0" max="360" value="0" id="shape-angle" class="form-range">
                        </div>
                        <div class="btn-grid">
                            <button class="btn" id="shape-circle">⭕</button>
                            <button class="btn" id="shape-square">⬜</button>
                            <button class="btn" id="shape-ellipse">🥚</button>
                            <button class="btn" id="shape-rectangle">▭</button>
                        </div>
                    </div>
                </section>
                <section class="sidebar-section">
                    <div class="sidebar-section-content">
                        <button class="btn btn-info btn-full" id="btn-edit" style="display: none;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                            Düzenle
                        </button>
                        <button class="btn btn-success btn-full" id="btn-edit-complete" style="display: none;">
                            Tamamla
                        </button>
                        <button class="btn btn-full" id="btn-clear-inner">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                </path>
                            </svg>
                            İç Sil
                        </button>
                        <button class="btn btn-full" id="btn-clear-outer">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                </path>
                            </svg>
                            Dış Sil
                        </button>
                        <button class="btn btn-danger btn-full" id="btn-reset">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74-2.74L3 12"></path>
                            </svg>
                            Sıfırla
                        </button>
                    </div>
                </section>
            </aside>
            <main id="canvas-container">
                <canvas id="main-canvas"></canvas>
            </main>
        </div>

        <div class="modal-overlay" id="startup-modal" style="display: flex;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Çalışma Alanı Ayarları</h3>
                </div>
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Tuval Genişliği (mm)</label>
                            <input type="number" value="2100" id="startup-width" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Tuval Yüksekliği (mm)</label>
                            <input type="number" value="2100" id="startup-height" class="form-input">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Izgara Genişliği (mm)</label>
                            <input type="number" value="25" id="startup-grid" class="form-input">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary btn-full" id="startup-confirm">Başla</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="edit-modal" style="display: none; align-items: flex-start; padding-top: 20px;">
            <div class="modal-content" style="margin: 0 0 0 20px; max-width: 350px;">
                <div class="modal-header">
                    <h3 id="edit-modal-title">Şekli Düzenle</h3>
                    <button class="btn btn-icon" id="edit-modal-close">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body" id="edit-modal-body">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary btn-full" id="edit-modal-ok">Kapat</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
